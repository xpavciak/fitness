name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Library packages are built first so workspace consumers (e.g. apps/mobile) resolve
      # their `dist` types during type-aware lint and typecheck.
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Includes the Expo web export of apps/mobile (expo export --platform web).
      - run: pnpm build
      # Web e2e smoke test of the exported app (onboarding -> plan -> log -> progress).
      - run: pnpm --filter @fitness/mobile exec playwright-core install --with-deps chromium
      - run: pnpm e2e:web
        env:
          E2E_SCREENSHOTS: ${{ github.workspace }}/apps/mobile/e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e-artifacts
          if-no-files-found: ignore
