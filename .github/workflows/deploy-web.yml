name: Deploy web

# Deploys the Expo web export (apps/mobile/dist) to Cloudflare Pages (D12), only after a CI push
# run has passed for the same commit:
# - the repository's default branch is deployed to production;
# - any other branch of this repository gets a preview at <branch>.<project>.pages.dev.
# Commits from forks are never deployed, because this job has access to the Cloudflare secrets.
#
# GitHub only runs `workflow_run` workflows that exist on the default branch, so nothing deploys
# until this file has been merged there.
#
# Setup (once): repository secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID. Optional repository variable CF_PAGES_PROJECT (default: fitness-plan).
# The custom domain is attached once in the Cloudflare dashboard (Pages project -> Custom domains).
# Without the secrets this workflow skips the deployment and passes.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    # Only push runs: every branch of this repo gets one, so a PR doesn't deploy twice, and fork
    # PRs (pull_request runs) are never deployed.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'fitness-plan' }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping the deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm

      # The Cloudflare secrets are deliberately not visible to the install and build steps.
      - name: Build the web export
        if: steps.creds.outputs.ok == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Pages project's production branch must be "main". If you create the project in the
          # dashboard instead, set its production branch to "main" or every deploy is a preview.
          # The default branch deploys to production. Any other branch is a preview; a non-default
          # branch that happens to be called "main" is renamed so it can't reach production.
          if [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            BRANCH=main
          elif [ "$HEAD_BRANCH" = "main" ]; then
            BRANCH=preview-main
          else
            BRANCH="$HEAD_BRANCH"
          fi
          if ! npx --yes wrangler@4.149.0 pages project list | grep -qw -- "$PROJECT"; then
            npx --yes wrangler@4.149.0 pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4.149.0 pages deploy apps/mobile/dist \
            --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$HEAD_SHA"
